name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The other MOCA repositories, at fixed refs: release tags, or commits while a Spec Change
# Proposal is in flight; never a branch (moca-spec CONTRIBUTING.md).
env:
  MOCA_SPEC_REF: 35380b8f89825c0b12312417639be08d4cb5ce9b  # 0.7.0 release candidate; v0.7.0 once tagged
  MOCA_READER_TYPESCRIPT_REF: a08da113ac3e80e4ab62c777dcab4b0cb58babe2  # 0.7.0 release candidate; v0.7.0 once tagged
  MOCA_TOOLS_REF: 42cd784d9369f085367cab4f884f51a646652a32  # 0.7.0 release candidate; v0.7.0 once tagged

jobs:
  deps:
    name: Public dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moca-reader-python
      # The check lives in moca-spec, the one copy every open repository runs.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          # Read access to the other MOCA repos while they are private.
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node moca-spec/scripts/check-deps.mjs moca-reader-python

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: moca-reader-python
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
        working-directory: moca-reader-python
      - run: uv run ruff check && uv run ruff format --check && uv run mypy
        working-directory: moca-reader-python
      # The Go age CLI (pinned, checksum-checked) for the age cross-check. On Linux it is required, so the
      # cross-check can never skip there (MOCA_REQUIRE_GO_AGE).
      - name: Install the Go age CLI
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - run: uv run pytest
        working-directory: moca-reader-python
        env:
          MOCA_REQUIRE_GO_AGE: ${{ runner.os == 'Linux' && '1' || '' }}

  corpus:
    name: Corpus and parity with the reference Reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moca-reader-python
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-reader-typescript
          ref: ${{ env.MOCA_READER_TYPESCRIPT_REF }}
          path: moca-reader-typescript
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-tools
          ref: ${{ env.MOCA_TOOLS_REF }}
          path: moca-tools
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
        working-directory: moca-reader-python
      - run: npm ci
        working-directory: moca-reader-typescript
      - run: npm ci
        working-directory: moca-tools
      - run: npm ci
        working-directory: moca-spec
      - run: node scripts/run-conformance.mjs --reader "../moca-reader-python/.venv/bin/python -m moca_reader.conformance"
        working-directory: moca-spec
      # The corpus never compares ranking; this checks we return what the reference Reader returns, in its order.
      - run: node tests/parity/parity.mjs
        working-directory: moca-reader-python

  # Phase 1's gate: the getting-started guide works as written (docs/getting-started.md).
  guide:
    name: Getting-started guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moca-reader-python
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      # moca-spec's corpus runner links the reference Reader and moca-tools until they are on npm.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-reader-typescript
          ref: ${{ env.MOCA_READER_TYPESCRIPT_REF }}
          path: moca-reader-typescript
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-tools
          ref: ${{ env.MOCA_TOOLS_REF }}
          path: moca-tools
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: moca-reader-typescript
      - run: npm ci
        working-directory: moca-tools
      # support-kb and the example trust root are unchanged since v0.6.0: its release files stand in for v0.7.0's
      # until v0.7.0 is released.
      - name: Example package from the moca-spec release
        env:
          GH_TOKEN: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
        run: gh release download v0.6.0 -R ${{ github.repository_owner }}/moca-spec -p support-kb.moca -p example-trust-root.json -D "$RUNNER_TEMP/assets"
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
        working-directory: moca-reader-python
      # Until moca-reader is on PyPI and the repositories are public: install the wheel built from this
      # commit, read the example from the private release, and use the moca-spec checkout. Drop each
      # replacement when what it stands in for is public.
      - run: >-
          node ../moca-spec/scripts/run-guide.mjs docs/getting-started.md
          --replace "pip install moca-reader=>pip install $RUNNER_TEMP/dist/moca_reader-*.whl"
          --replace "https://github.com/openmoca/moca-spec/releases/download/v0.7.0/=>file://$RUNNER_TEMP/assets/"
          --replace "git clone --depth 1 --branch v0.7.0 https://github.com/openmoca/moca-spec.git=>ln -s $GITHUB_WORKSPACE/moca-spec moca-spec"
        working-directory: moca-reader-python
