name: Release

# Push a vX.Y.Z tag on a commit in main: builds moca-reader and its bindings, and publishes them to PyPI,
# moca-reader first, then moca-reader-langchain and moca-reader-llamaindex, which pin it at the same version.
# On a pull request to main, the same checks run and the same files are built and checked with twine, so the
# release path is proved before release day; nothing is published.
#
# Trusted publishing: PyPI accepts this workflow, in the `release` environment, through a short-lived
# OIDC token from GitHub Actions. There is no PyPI token in this repository. The upload action also
# publishes a signed attestation for each file.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Check and build (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The tools that make the release files are pinned exactly: uv here, the build backend in
      # .github/build-constraints.txt, and twine below.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - name: The tag is on main and every version matches it (on a pull request, matches the reader's)
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
            want="${GITHUB_REF_NAME#v}"
          else
            want=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          fi
          for f in pyproject.toml packages/*/pyproject.toml; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f")
            [ "$v" = "$want" ] || { echo "::error::$f is $v, the tag is $GITHUB_REF_NAME"; exit 1; }
          done
          grep -q "^__version__ = \"$want\"" src/moca_reader/__init__.py || { echo "::error::__version__ does not match $GITHUB_REF_NAME"; exit 1; }
          for f in packages/*/pyproject.toml; do
            grep -q "\"moca-reader==$want\"" "$f" || { echo "::error::$f does not pin moca-reader==$want"; exit 1; }
          done
      - run: uv build --package moca-reader -o dist/reader --build-constraints .github/build-constraints.txt
      - run: |
          uv build --package moca-reader-langchain -o dist/bindings --build-constraints .github/build-constraints.txt
          uv build --package moca-reader-llamaindex -o dist/bindings --build-constraints .github/build-constraints.txt
      - run: uvx twine@7.0.0 check --strict dist/reader/* dist/bindings/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  reader:
    name: Publish moca-reader
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/reader/

  bindings:
    name: Publish the bindings
    needs: reader
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/bindings/
